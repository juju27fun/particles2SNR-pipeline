[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particles2snr-pipeline"
version = "0.1.0"
description = "Particle dataset generation, signal-processing experiments, and provenance"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["particles2snr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

